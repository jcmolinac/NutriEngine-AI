<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Center Leaf & Aperture Symbol -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Food bowl / plate outline -->
    <circle cx="160" cy="160" r="120" fill="none" stroke="#ffffff" stroke-width="18" stroke-dasharray="8 8" opacity="0.4"/>
    <circle cx="160" cy="160" r="95" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="12" />
    <!-- Dynamic Energy Leaf & Activity Wave -->
    <path d="M160 80 C 220 80, 240 130, 240 180 C 240 220, 200 240, 160 240 C 120 240, 80 220, 80 180 C 80 120, 120 80, 160 80 Z" fill="#ffffff" />
    <path d="M160 100 C 160 150, 190 180, 220 180" stroke="#059669" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Center pulse spark -->
    <circle cx="160" cy="160" r="16" fill="#059669" />
  </g>
</svg>
